<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>NOCTIS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      /* Only ever present with ?hud=1. The gates never render with it on. */
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        margin: 0;
        padding: 8px 10px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfd4da;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
